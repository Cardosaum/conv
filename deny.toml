# cargo-deny 0.20. https://embarkstudios.github.io/cargo-deny/
# Vulnerability and notice advisories always fail. The old `vulnerability`,
# `notice`, and `severity-threshold` keys are rejected by this version.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
# Applies when fetching is disabled. An older database fails the check.
maximum-db-staleness = "P90D"
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"

# Permissive licenses that can be combined with this crate's MIT license.
# Copyleft and non-commercial licenses are not listed, so they are denied.
# An OR expression passes when one side is listed. An AND expression passes
# only when every term is listed.
[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# ciborium-ll requires half, and half 2 requires zerocopy, whose derive
# crate still uses syn 2. clap, serde, and thiserror use syn 3.
skip = [
    { crate = "syn:^2", reason = "zerocopy-derive via ciborium-ll -> half still uses syn 2" },
]

[bans.std-replacements]
scope = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
