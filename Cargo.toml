[package]
name = "conv"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
license = "MIT"
description = "Convert structured data between encodings"
repository = "https://github.com/Cardosaum/conv"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
ciborium = "0.2.2"
clap = { version = "4.6.7", features = ["derive", "cargo", "wrap_help"] }
rmp-serde = "1.3.1"
ron = "0.12.2"
serde = "1.0.229"
serde-saphyr = "2.0.0"
serde_html_form = "0.4.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
rstest = { version = "0.28.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
